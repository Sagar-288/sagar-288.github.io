<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit Dash — Download</title>

  <script>
    // ─── CONFIGURE ───────────────────────────────────────────────
    var APP_STORE_ID = "id6759604722";
    var APP_STORE_PATH = "/app/orbit-dash-infinity/" + APP_STORE_ID;
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.orbitdash.orbitdash";
    var FALLBACK_URL= "https://sagar-288.github.io/orbitdash/";
    // ─────────────────────────────────────────────────────────────

    // Map navigator language to App Store country code
    function getAppStoreCountry() {
      var lang = (navigator.language || navigator.userLanguage || "").toLowerCase();
      // language-region pairs → country code
      var regionMap = {
        "en-us": "us", "en-gb": "gb", "en-au": "au", "en-ca": "ca", "en-in": "in",
        "en-nz": "nz", "en-sg": "sg", "en-za": "za", "en-ie": "ie", "en-ph": "ph",
        "fr-fr": "fr", "fr-ca": "ca", "fr-be": "be", "fr-ch": "ch",
        "de-de": "de", "de-at": "at", "de-ch": "ch",
        "es-es": "es", "es-mx": "mx", "es-ar": "ar", "es-co": "co", "es-cl": "cl",
        "pt-br": "br", "pt-pt": "pt",
        "it-it": "it", "nl-nl": "nl", "nl-be": "be",
        "ja-jp": "jp", "ko-kr": "kr", "zh-cn": "cn", "zh-tw": "tw", "zh-hk": "hk",
        "ru-ru": "ru", "tr-tr": "tr", "pl-pl": "pl", "sv-se": "se", "nb-no": "no",
        "da-dk": "dk", "fi-fi": "fi", "th-th": "th", "vi-vn": "vn", "id-id": "id",
        "ms-my": "my", "ar-sa": "sa", "ar-ae": "ae", "he-il": "il", "hi-in": "in",
        "uk-ua": "ua", "ro-ro": "ro", "hu-hu": "hu", "cs-cz": "cz", "sk-sk": "sk",
        "el-gr": "gr", "bg-bg": "bg", "hr-hr": "hr"
      };
      // language-only fallback
      var langMap = {
        "en": "us", "fr": "fr", "de": "de", "es": "es", "pt": "br", "it": "it",
        "nl": "nl", "ja": "jp", "ko": "kr", "zh": "cn", "ru": "ru", "tr": "tr",
        "pl": "pl", "sv": "se", "nb": "no", "da": "dk", "fi": "fi", "th": "th",
        "vi": "vn", "id": "id", "ms": "my", "ar": "sa", "he": "il", "hi": "in",
        "uk": "ua", "ro": "ro", "hu": "hu", "cs": "cz", "sk": "sk", "el": "gr"
      };
      return regionMap[lang] || langMap[lang.split("-")[0]] || "us";
    }

    function getIosUrl() {
      var country = getAppStoreCountry();
      return "https://apps.apple.com/" + country + APP_STORE_PATH;
    }

    var IOS_URL = getIosUrl();

    function isAppleDevice(ua) {
      // iPhone / iPod
      if (/iPhone|iPod/.test(ua)) return true;
      // iPad (old UA string)
      if (/iPad/.test(ua)) return true;
      // iPad (modern: reports as Macintosh + has touch)
      if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return true;
      // macOS desktop
      if (/Macintosh|Mac OS X/.test(ua)) return true;
      return false;
    }

    function isAndroid(ua) {
      // Standard Android UA check
      if (/android/i.test(ua)) return true;
      // Android tablets in desktop mode: Chrome removes "Android" from UA,
      // but navigator.userAgentData (Client Hints API) still reports the real platform
      if (navigator.userAgentData && navigator.userAgentData.platform === "Android") return true;
      // Fallback: Linux + touch support (covers tablets in desktop mode without Client Hints)
      if (/Linux/.test(ua) && !(/CrOS/.test(ua)) && navigator.maxTouchPoints > 0) return true;
      return false;
    }

    window.addEventListener("DOMContentLoaded", function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;

      if (isAndroid(ua)) {
        // Android phone/tablet → Play Store
        window.location.replace(ANDROID_URL);
      } else if (isAppleDevice(ua)) {
        // iPhone, iPad, iPod, macOS → App Store
        window.location.replace(IOS_URL);
      } else {
        // Other desktop / unknown → show all options
        showOptions();
      }
    });

    // Fallback: if redirect hasn't happened after 5s, show options
    setTimeout(function () {
      if (document.getElementById("spinner-wrap").style.display !== "none") {
        showOptions();
      }
    }, 5000);

    function showOptions() {
      document.getElementById("spinner-wrap").style.display = "none";
      document.getElementById("options").style.display     = "flex";
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .app-icon { font-size: 72px; margin-bottom: 20px; }
    h1 { font-size: 28px; font-weight: 800; color: #111; margin-bottom: 8px; }
    .subtitle { color: #6b7280; font-size: 15px; line-height: 1.6; margin-bottom: 36px; }

    /* Spinner (shown while JS detects the OS) */
    #spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .redirect-msg { color: #9ca3af; font-size: 14px; }

    /* Options (shown to desktop users) */
    #options {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .badge-link {
      display: inline-block;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .badge-link:hover {
      transform: translateY(-2px);
      opacity: 0.85;
    }
    .badge-link img {
      height: 50px;
      width: auto;
    }

    .btn-web {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      color: white;
      background: linear-gradient(135deg, #8B5CF6, #5B21B6);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn-web:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }

    hr { border: none; border-top: 1px solid #f3f4f6; }

    .powered {
      margin-top: 32px;
      font-size: 11px;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="app-icon"><img src="assets/game_logo.png" width="100" height="100" alt="Orbit Dash: Infinity"></div>
    <h1>Orbit Dash: Infinity</h1>
    <p class="subtitle">Just a moment — we're sending you to the right store for your device.</p>

    <!-- Shown while JS is detecting the device -->
    <div id="spinner-wrap">
      <div class="spinner"></div>
      <p class="redirect-msg">Detecting your device…</p>
    </div>

    <!-- Shown to desktop / undetected users -->
    <div id="options">
      <a href="#" id="ios-btn" class="badge-link" onclick="this.href=IOS_URL">
        <img src="assets/app-store-badge.svg" alt="Download on the App Store" />
      </a>

      <a href="#" id="android-btn" class="badge-link" onclick="this.href=ANDROID_URL">
        <img src="assets/google-play-badge.png" alt="Get it on Google Play" />
      </a>

      <hr />

      <a href="#" id="web-btn" class="btn btn-web" onclick="this.href=FALLBACK_URL">
        🌐 Visit Website
      </a>
    </div>

    <!-- <p class="powered">Smart redirect · No tracking · Open source</p> -->
  </div>
</body>
</html>
